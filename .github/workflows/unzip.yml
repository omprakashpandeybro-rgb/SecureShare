name: Unzip
on: push
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o app.zip
          unzip -o gradle.zip
          rm app.zip gradle.zip
          ls -la
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Unzip app and gradle"
